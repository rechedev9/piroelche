# Cheap PR/main check of the workflow YAML with a pinned actionlint.
# Runs only when a workflow or the lane's script changes.
name: CI infra

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/ci-infra.sh"
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infra:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint workflows
        run: bash scripts/ci-infra.sh
