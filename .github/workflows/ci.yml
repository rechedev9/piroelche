# Cheap PR/main quality lane for the site: dependency advisories, types, lint,
# unit tests and a production build. No browser tests here: run them locally
# with `pnpm test:e2e` (Chromium, Firefox and WebKit).
name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Audit, types, lint, unit and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PIROBOOM_PUBLIC_SITE: "0"
      PIROBOOM_DEMO: "0"
      PIROBOOM_LOCAL_REVIEW: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.22.0"
          run_install: false
          cache: true

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check production dependency advisories
        run: pnpm audit --prod --audit-level high

      - name: Types, lint and unit tests
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      - name: Build
        run: pnpm build
